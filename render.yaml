# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free-tier Blueprint: FastAPI + Vite static site + Postgres.
# MongoDB Atlas is still required (set MONGO_URL in the dashboard).
# Free web services spin down after ~15 minutes idle. Free Postgres expires after 30 days.

services:
  - type: web
    name: inteligentresearch-api
    runtime: python
    plan: free
    region: oregon
    branch: NewFeature
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: inteligentresearch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DEV_RETURN_OTP
        value: "false"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MONGO_DB_NAME
        value: inteligentresearchMongo
      - key: FRONTEND_URL
        fromService:
          name: inteligentresearch-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONGO_URL
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false

  - type: web
    name: inteligentresearch-web
    runtime: static
    region: oregon
    branch: NewFeature
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        fromService:
          name: inteligentresearch-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: inteligentresearch-db
    plan: free
    databaseName: inteligentresearch
    postgresMajorVersion: "16"
    ipAllowList: []
